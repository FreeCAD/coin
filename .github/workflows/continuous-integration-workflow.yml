name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request: {}
  #push:
  #  branches: [ master ]

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  ubuntu-build:
    name: Ubuntu CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          scripts/install-dependencies.sh gl
          sudo apt-get -y update
          sudo apt-get -y install \
            freeglut3-dev libyaml-cpp-dev libglfw3-dev \
            libgl1-mesa-dri mesa-utils xvfb ninja-build
          cmake -S . -B cmake_build_dir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=cmake_install_dir \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} \
            -DCOIN_BUILD_TESTS=ON \
            -DCOIN_BUILD_GL_TESTS=ON \
            -DCOIN_BUILD_EXAMPLES=OFF \
            -DCOIN_BUILD_DOCUMENTATION=OFF \
            -DCOIN_BUILD_VISUAL_TESTS=OFF \
            -DCOIN_STRICT_WARNINGS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install OffscreenContextTest --config Release --parallel
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release --parallel
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run generic OpenGL tests
        run: xvfb-run -a ctest -C Release -L "gl-(core|compat)" --output-on-failure
        working-directory: cmake_build_dir
      - name: Run EGL tests
        run: ctest -C Release -L requires-egl --output-on-failure
        working-directory: cmake_build_dir
      - name: Configure visual tests
        if: matrix.renderer_state == 'enabled'
        run: |
          cmake -S . -B cmake_build_dir_rt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOIN_BUILD_TESTS=OFF \
            -DCOIN_BUILD_EXAMPLES=OFF \
            -DCOIN_BUILD_LEGACY_GL_RENDERER=ON \
            -DCOIN_BUILD_VISUAL_TESTS=ON
      - name: Build visual tests
        if: matrix.renderer_state == 'enabled'
        run: cmake --build cmake_build_dir_rt --config Release -- -j4
      - name: Run visual smoke test
        if: matrix.renderer_state == 'enabled'
        run: ctest --test-dir cmake_build_dir_rt -L visual-smoke --output-on-failure -VV
      - name: Run visual suite
        if: matrix.renderer_state == 'enabled'
        run: |
          ctest --test-dir cmake_build_dir_rt -L visual-contract --output-on-failure -VV
          xvfb-run -a ctest --test-dir cmake_build_dir_rt -L visual-legacy --output-on-failure -VV
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Artifacts-LegacyGL-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v7
        if: always() && matrix.renderer_state == 'enabled'
        with:
          name: Ubuntu-VisualTest-Artifacts
          path: |
            cmake_build_dir_rt/render_artifacts/
            cmake_build_dir_rt/Testing/

  windows-build:
    name: Windows CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install test dependencies
        shell: bash
        run: scripts/install-dependencies.sh gl
      - name: Create build directory and run CMake
        shell: cmd
        run: |
          cmake -S . -B cmake_build_dir -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target INSTALL --config Release --parallel 2
      - name: Check installed package
        shell: pwsh
        run: |
          $prefix = (Join-Path $env:GITHUB_WORKSPACE "cmake_install_dir").Replace('\', '/')
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build installed-package-smoke --config Release --parallel 2
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run core-profile tests
        run: ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Artifacts-LegacyGL-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS CI (Legacy renderer ${{ matrix.renderer_state }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer_state: enabled
            legacy_gl_renderer: ON
          - renderer_state: disabled
            legacy_gl_renderer: OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install test dependencies
        run: scripts/install-dependencies.sh gl
      - name: Create build directory and run CMake
        run: |
          cmake -S . -B cmake_build_dir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCMAKE_CXX_STANDARD=11 -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON -DCOIN_BUILD_GL_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release --parallel
      - name: Check installed package
        run: |
          cmake -S testsuite/installed-package-smoke -B installed-package-smoke \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake_install_dir"
          cmake --build installed-package-smoke --config Release --parallel
      - name: Run unit tests
        run: ctest -C Release -L unit --output-on-failure
        working-directory: cmake_build_dir
      - name: Run core-profile tests
        run: ctest -C Release -L gl-core --output-on-failure
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macOS-Artifacts-LegacyGL-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()
