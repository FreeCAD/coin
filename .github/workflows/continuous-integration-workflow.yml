name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
    branches: [ master, freecad-master ]
  #push:
  #  branches: [ master ]

jobs:
  ubuntu-runtime:
    name: Ubuntu runtime (${{ matrix.legacy_gl_renderer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_gl_renderer: [ON, OFF]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Run tests (default context)
        if: matrix.legacy_gl_renderer == 'ON'
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
        env:
          COIN_EGL: 1
          EGL_PLATFORM: surfaceless
          COIN_EGL_CORE_PROFILE: 0
      - name: Run tests (core-profile context)
        run: ctest -C Release -VV
        working-directory: cmake_build_dir
        env:
          COIN_EGL: 1
          EGL_PLATFORM: surfaceless
          COIN_EGL_CORE_PROFILE: 1
      - name: Create Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Ubuntu-Artifacts-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()

  windows-build:
    name: Windows build (${{ matrix.legacy_gl_renderer }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        legacy_gl_renderer: [ON, OFF]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        shell: cmd
        run: |
          cmake -S . -B cmake_build_dir -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target INSTALL --config Release -- /nologo /verbosity:minimal /maxcpucount:2 /property:MultiProcessorCompilation=true
      - name: Run tests
        run:  ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Windows-Artifacts-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS build (${{ matrix.legacy_gl_renderer }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        legacy_gl_renderer: [ON, OFF]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Create build directory and run CMake
        run: |
          cmake -S . -B cmake_build_dir -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=cmake_install_dir -DCMAKE_CXX_STANDARD=11 -DCOIN_BUILD_LEGACY_GL_RENDERER=${{ matrix.legacy_gl_renderer }} -DCOIN_BUILD_TESTS=ON
      - name: Build project
        run: cmake --build cmake_build_dir --target install --config Release -- -j4
      - name: Run tests
        run:  ctest -C Release -VV
        working-directory: cmake_build_dir
      - name: Create Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: MacOS-Artifacts-${{ matrix.legacy_gl_renderer }}
          path: cmake_install_dir/
        if: always()
        
